name: Agent Coding Worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Agent task ID"
        required: true
        type: string

      spec:
        description: "Implementation specification"
        required: true
        type: string

permissions:
  contents: write

jobs:
  agent-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create agent branch
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: |
          BRANCH="agent/${TASK_ID}"
          echo "AGENT_BRANCH=$BRANCH" >> "$GITHUB_ENV"

          git checkout -B "$BRANCH"

          echo "Created branch: $BRANCH"

      - name: Prepare OpenAI coding request
        env:
          TASK_ID: ${{ inputs.task_id }}
          TASK_SPEC: ${{ inputs.spec }}
        run: |
          python3 <<'PY'
          import json
          import os

          task_id = os.environ["TASK_ID"]
          spec = os.environ["TASK_SPEC"]

          prompt = f"""
          You are an autonomous senior software engineer working inside a GitHub Actions workspace.

          TASK ID:
          {task_id}

          IMPLEMENTATION SPECIFICATION:
          {spec}

          The repository may currently contain only a README.

          Your job is to create or modify the project so the specification is implemented.

          For a new web project:
          - Use Next.js with TypeScript.
          - Use the App Router.
          - Create a complete runnable project.
          - Keep dependencies minimal.
          - Make the UI responsive.
          - Do not require interactive setup commands.
          - The project must run with npm install and npm run build.

          IMPORTANT:
          Return ONLY valid JSON.
          Do not use markdown fences.
          Do not include explanations outside JSON.

          Required JSON format:

          {{
            "files": [
              {{
                "path": "package.json",
                "content": "file contents here"
              }}
            ]
          }}

          Include every file that needs to be created or replaced.

          Do not include:
          - node_modules
          - lock files
          - build output
          - secrets
          - binary files
          """

          payload = {
              "model": "gpt-5.6-sol",
              "input": prompt,
              "reasoning": {
                  "effort": "medium"
              },
              "text": {
                  "format": {
                      "type": "json_object"
                  }
              }
          }

          with open("openai-request.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

      - name: Call OpenAI Coding Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is missing"
            exit 1
          fi

          SUCCESS=false

          for ATTEMPT in 1 2 3; do
            echo "======================================"
            echo "OpenAI attempt $ATTEMPT/3"
            echo "======================================"

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --output openai-response.json \
              --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer $OPENAI_API_KEY" \
              --data @openai-request.json \
              "https://api.openai.com/v1/responses")

            echo "HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              SUCCESS=true
              break
            fi

            echo "OpenAI request failed."

            cat openai-response.json || true

            if [ "$ATTEMPT" -lt 3 ]; then
              echo ""
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "OpenAI failed after 3 attempts."
            exit 1
          fi

      - name: Apply generated files
        run: |
          python3 <<'PY'
          import json
          import os
          import sys

          with open("openai-response.json", "r", encoding="utf-8") as f:
              response = json.load(f)

          text = None

          for item in response.get("output", []):
              if item.get("type") != "message":
                  continue

              for content in item.get("content", []):
                  if content.get("type") == "output_text":
                      text = content.get("text")
                      break

              if text:
                  break

          if not text:
              print("OpenAI response does not contain output_text.")
              print(json.dumps(response, indent=2))
              sys.exit(1)

          try:
              result = json.loads(text)
          except json.JSONDecodeError as exc:
              print("OpenAI did not return valid JSON.")
              print(text)
              raise exc

          files = result.get("files")

          if not isinstance(files, list) or not files:
              print("No files were returned by the coding agent.")
              sys.exit(1)

          root = os.path.realpath(os.getcwd())

          for item in files:
              path = item.get("path")
              content = item.get("content")

              if not isinstance(path, str) or not isinstance(content, str):
                  print("Invalid file entry:", item)
                  sys.exit(1)

              target = os.path.realpath(os.path.join(root, path))

              if not target.startswith(root + os.sep):
                  print("Unsafe path rejected:", path)
                  sys.exit(1)

              parent = os.path.dirname(target)

              if parent:
                  os.makedirs(parent, exist_ok=True)

              with open(target, "w", encoding="utf-8") as f:
                  f.write(content)

              print("Written:", path)
          PY

      - name: Remove agent temporary files
        run: |
          rm -f openai-request.json
          rm -f openai-response.json

      - name: Verify package.json
        run: |
          if [ ! -f package.json ]; then
            echo "Coding agent did not create package.json"
            exit 1
          fi

          echo "package.json found"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Commit generated code
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: |
          git config user.name "agent-coding-worker"
          git config user.email "agent-coding-worker@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No code changes generated."
            exit 0
          fi

          git commit -m "${TASK_ID}: implement agent task"

          git push --force-with-lease origin "$AGENT_BRANCH"

          echo "Code pushed to $AGENT_BRANCH"
